tests:
  r4c-test:
    main: Spec.hs
    source-dirs:
      - test
    # other-modules:  -- versucht alles zu laden was tasty importiert? 
      # - MarkdownSpec
      # - OrchestratorSpec
      # - RegionSpec
      # - WorldBankSpec
      # - AggregateSpec
      # - DatasetSyncSpec
    dependencies:
      - Regions4Countries
      - tasty
      - tasty-hunit
      - temporary
      # - HUnit

ghc-options: 
    -Wall
    -fno-warn-unused-binds 
    -fno-warn-deprecations 
    -fno-warn-unused-do-bind 
    -fno-warn-unused-imports
    -fno-warn-missing-signatures
    -fno-warn-orphans
    -fno-warn-type-defaults 
    -fno-warn-unused-matches 
    -fno-warn-warnings-deprecations   
    -fno-warn-missing-methods 
    -fno-warn-missing-home-modules
    -fno-warn-duplicate-exports 
    -fno-warn-incomplete-patterns 
    -Wno-missing-fields
    -Wno-name-shadowing  
    -Wno-incomplete-record-updates
    #-Wno-incomplete-uni-patterns
    # no-warn-missing-fields perhpas not a good idea for always?
    # -Wunused-packages  # only useful for clean (after deleting dist)
    
default-extensions: 
    - OverloadedStrings
    - MultiParamTypeClasses 
    - ScopedTypeVariables 
    - DeriveGeneric
    - DeriveAnyClass
    - FlexibleInstances  
    - FlexibleContexts
    - InstanceSigs
